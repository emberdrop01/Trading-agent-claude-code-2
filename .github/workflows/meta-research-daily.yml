name: Daily Meta-Research Intelligence

on:
  schedule:
    - cron: '0 0 * * *'  # midnight UTC daily
  workflow_dispatch: {}

concurrency:
  group: meta-research
  cancel-in-progress: false

jobs:
  run-meta-research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install script dependencies
        working-directory: scripts
        run: npm install --omit=dev

      - name: Run meta-research pipeline
        working-directory: scripts
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || vars.AI_PROVIDER || 'gemini' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.GEMINI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
        run: node run-meta-research.mjs
