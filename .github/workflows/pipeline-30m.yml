name: Trading Pipeline (30m)

# Runs the Deriv fetch -> AI 4-persona analysis -> Telegram alert pipeline on
# a schedule. Replaces the in-process node-cron scheduler from the original
# Express app - GitHub has no free always-on server hosting.
#
# Cron schedules on GitHub Actions are best-effort, not exact - GitHub
# documents that scheduled runs can be delayed under load.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated symbols to override SYMBOLS for this manual run'
        required: false
        default: ''

concurrency:
  group: trading-pipeline
  cancel-in-progress: false

permissions:
  contents: write  # needed so the workflow can commit status.json back

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install script dependencies
        working-directory: scripts
        run: npm install --omit=dev

      - name: Run trading pipeline
        working-directory: scripts
        env:
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # Provider-agnostic AI config - see GITHUB_DEPLOY.md "Switching AI providers".
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || vars.AI_PROVIDER || 'gemini' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.GEMINI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          SYMBOLS: ${{ inputs.symbols || vars.SYMBOLS || 'R_75,R_100' }}
          CANDLE_GRANULARITY_SECONDS: ${{ vars.CANDLE_GRANULARITY_SECONDS || '1800' }}
          TRIGGER_SOURCE: ${{ github.event_name == 'workflow_dispatch' && 'MANUAL_RUN' || 'CRON_30M' }}
        run: node run-pipeline.mjs

      - name: Commit status.json (keeps schedule alive + gives you a run history)
        run: |
          if [ -n "$(git status --porcelain scripts/status.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/status.json
            git commit -m "chore: update trading pipeline status [skip ci]"
            git push
          else
            echo "No status.json changes to commit."
          fi
