name: Telegram Remote Config Listener

# Polls Telegram getUpdates for privileged commands (see scripts/update-config-from-telegram.mjs)
# and writes GitHub Secrets/Variables on your behalf via the GitHub API.
#
# This is POLL-BASED, not instant: a command you send takes up to this
# schedule's interval to be picked up, then applies on the NEXT pipeline run
# after that. "Whenever you want" means "within ~15 minutes", not real-time.
#
# SECURITY: this workflow requires GH_PAT - a Personal Access Token with
# write access to this repo's secrets and variables. That is a MORE powerful
# credential than anything else in this repo: if it leaks, an attacker can
# rewrite every secret you have. Read the PAT setup + scoping instructions in
# GITHUB_DEPLOY.md before adding it. If you don't want this attack surface,
# don't enable this workflow - just edit secrets by hand in the GitHub UI,
# which takes about the same amount of time and has none of this risk.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: telegram-listener
  cancel-in-progress: false

permissions:
  contents: write  # to commit the offset file back

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install script dependencies
        working-directory: scripts
        run: npm install --omit=dev

      - name: Poll Telegram for config commands
        working-directory: scripts
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CONTROL_PASSPHRASE: ${{ secrets.CONTROL_PASSPHRASE }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node update-config-from-telegram.mjs

      - name: Commit Telegram offset
        run: |
          if [ -n "$(git status --porcelain scripts/telegram-offset.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/telegram-offset.json
            git commit -m "chore: update telegram offset [skip ci]"
            git push
          else
            echo "No offset change to commit."
          fi
